kind = "web"
previewPath = "/"
title = "NOVA Skin Med Spa"
description = "Sitio web premium para NOVA Skin Med Spa con landing pública, contenido audiovisual administrable y panel protegido para gestionar servicios, galería, videos, promociones, especialistas, testimonios y mensajes."
version = "1.0.0"
id = "artifacts/nova-skin"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21757

[services.development]
run = "pnpm --filter @workspace/nova-skin run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nova-skin", "run", "build" ]
serve = "static"
publicDir = "artifacts/nova-skin/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21757"
BASE_PATH = "/"
